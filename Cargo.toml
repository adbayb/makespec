[package]
name = "makespec"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A local-first CLI for architecture decisions and RFCs"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
deunicode = "1.6"
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"

[[bench]]
name = "catalog"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
