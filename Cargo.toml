[package]
name = "makespec"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "A local-first CLI for decisions and specifications"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
deunicode = "1.6"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
sha2 = { version = "0.11", default-features = false }
tempfile = "3.27"
thiserror = "2.0"

[[bench]]
name = "catalog"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
